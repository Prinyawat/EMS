<div class="layout-topbar">
    <!-- <a class="layout-topbar-logo" routerLink="">
        <img src="assets/layout/images/{{layoutService.config().colorScheme === 'light' ? 'logo-dark' : 'logo-white'}}.svg" alt="logo">
        <span>SAKAI</span>
    </a> -->

    <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
        <i class="pi pi-bars"></i>
    </button>

    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
        (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <div #topbarmenu class="layout-topbar-menu align-items-center"
        [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <!-- <button class="p-link layout-topbar-button">
            <i class="pi pi-calendar"></i>
            <span>Calendar</span>
        </button> -->
        <!-- <button class="p-link layout-topbar-button">
            <i class="pi pi-user"></i>
            <span>Profile</span>
        </button> -->
        <!-- <button class="p-link layout-topbar-button" [routerLink]="'/documentation'">
            <i class="pi pi-cog"></i>
            <span>Settings</span>
        </button> -->

        <i class="pi pi-bell mr-2 p-text-secondary" pBadge style="font-size: 1.5rem"
        (click)="showPositionDialog('top-right')" label="TopRight"></i>

        <p-dialog header="Notifications" [(visible)]="displayPosition" [position]="position" [modal]="true" [style]="{width: '50vw'}" [draggable]="false" [resizable]="false">
            <ul class="p-0 mx-0 mt-0 mb-4 list-none">

                <!-- <div *ngIf="leaveRequestMessage" [innerHTML]="leaveRequestMessage"></div> -->

                <ng-container *ngFor="let message of leaveRequestMessages">
                    <div [innerHTML]="message"></div>
                </ng-container>

            </ul>
        </p-dialog>

        <button class="p-link layout-topbar-button" (click)="toggleMenu($event)">
            <i class="pi pi-user"></i>
            <span>Profile</span>
        </button>
        <p-menu #profileMenu [popup]="true" [model]="profileItems"></p-menu>
    </div>
</div>
