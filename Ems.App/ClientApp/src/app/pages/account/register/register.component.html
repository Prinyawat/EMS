<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Create a new account</div>
                    <span class="text-600 font-medium">Sign up to continue</span>
                </div>

                <div class="grid">
                    <!-- First Name -->
                    <div class="col-12 md:col-6">
                        <label for="firstName" class="block text-900 text-xl font-medium mb-2">First Name</label>
                        <input id="firstName" type="text" placeholder="First Name" pInputText class="w-full" style="padding:1rem">
                    </div>

                    <!-- Last Name -->
                    <div class="col-12 md:col-6">
                        <label for="lastName" class="block text-900 text-xl font-medium mb-2">Last Name</label>
                        <input id="lastName" type="text" placeholder="Last Name" pInputText class="w-full" style="padding:1rem">
                    </div>
                </div>

                <div class="grid">
                    <!-- Phone -->
                    <div class="col-12 md:col-6">
                        <label for="phone" class="block text-900 text-xl font-medium mb-2">Phone</label>
                        <input id="phone" type="text" placeholder="Phone number" pInputText class="w-full" style="padding:1rem">
                    </div>
                
                    <!-- Position -->
                    <div class="col-12 md:col-6">
                        <label for="position" class="block text-900 text-xl font-medium mb-2">Position</label>
                        <p-dropdown id="position" [options]="positions" placeholder="Select Position" class="w-full" ></p-dropdown>
                    </div>
                </div>

                <!-- Email -->
                <label for="email" class="block text-900 text-xl font-medium mb-2">Email</label>
                <input id="email" type="text" placeholder="Email address" pInputText class="w-full md:w-30rem mb-5" style="padding:1rem">

                <!-- Password -->
                <label for="password" class="block text-900 font-medium text-xl mb-2">Password</label>
                <p-password id="password" [(ngModel)]="password" placeholder="Password" [toggleMask]="true" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"></p-password>


                <div class="text-center">
                    <button pButton pRipple label="Sign Up" class="w-full p-3 text-xl p-button-outlined"></button>
                    <p-button label="Already have an account?" styleClass="p-button-link" routerLink="/account/login"></p-button>
                </div>
            </div>
        </div>
    </div>
</div>
