<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div
            style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">
                        เข้าสู่ระบบ</div>
                    <!-- <span class="text-600 font-medium">Sign in to continue</span> -->
                    <div *ngIf="isError" style="color: red;">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
                    <div *ngIf="isError" style="color: red;">กรุณาตรวจสอบชื่อผู้ใช้หรือรหัสผ่านของคุณ</div>
                    <div *ngIf="isError" style="color: red;">จากนั้นให้ลองเข้าสู่ระบบอีกครั้ง</div>
                </div>

                <div>
                    <label for="email1" class="block text-900 text-xl font-medium mb-2">Email</label>
                    <input id="email1" type="text" placeholder="อีเมล" pInputText class="w-full     md:w-30rem mb-5" 
                        style="padding:1rem" [(ngModel)]="user.email"  
                        [ngClass]="{'ng-invalid': emailDirty, 'ng-dirty': isDirty}">

                    <label for=" password1" class="block text-900 font-medium text-xl mb-2">Password</label>
                    <p-password id="password1" [(ngModel)]="password" placeholder="รหัสผ่าน" [toggleMask]="true"
                        styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"
                        [(ngModel)]="user.password" [ngClass]="{'ng-invalid': passwordDirty, 'ng-dirty': isDirty}"></p-password>

                    <div class="flex align-items-center justify-content-between mb-5 gap-5">
                        <div class="flex align-items-center">
                            <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
                            <label for="rememberme1">จำฉันไว้</label>
                        </div>
                        <!-- <a class="font-medium no-underline ml-2 text-right cursor-pointer"
                            style="color: var(--primary-color)">Forgot password?</a> -->
                    </div>
                    <!-- <button pButton pRipple label="Sign In" class="w-full p-3 text-xl"
                    [routerLink]="['/home']"></button> -->
                    <button pButton pRipple label="ลงชื่อเข้าใช้" class="w-full p-3 text-xl" (click)="signIn()"></button>
                </div>
                <hr>
                <div class="my-5 text-center">
                    <span class="text-600">ยังไม่มีบัญชี?</span>
                </div>

                <div class="text-center">
                    <button pButton pRipple label="ลงทะเบียน" class="w-full p-3 text-xl p-button-outlined"
                        [routerLink]="['/account/register']"></button>
                </div>
            </div>
        </div>
    </div>
</div>
