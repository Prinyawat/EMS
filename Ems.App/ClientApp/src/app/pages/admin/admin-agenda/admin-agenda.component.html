<div class="grid p-fluid" >

    <div class="col-12 ">
        <div class="card card-w-title">
            <p-breadcrumb [model]="breadcrumbItems" [home]="{icon: 'pi pi-home'}"></p-breadcrumb>
        </div>
    </div>

    <div class="col-12 md:col-12">
        <div class="card col-12">
            <p-toolbar styleClass="mb-3">

                <h5>จัดการระบบเช็คอินผู้ใช้</h5>
                <ng-template pTemplate="right">
                    <button pButton pRipple label="ส่งออก Excel" icon="pi pi-print" class="p-button-help" (click)="exportExcel()" pTooltip="XLS" tooltipPosition="bottom" [expandedRowKeys]="expandedRows"></button>

                </ng-template>

            </p-toolbar>

			<p-table #agendaSerch [value]="HeaderData" dataKey="GroupName" [rowHover]="true" styleClass="p-datatable-gridlines" [paginator]="true" responsiveLayout="scroll" [rows] = "10" [tableStyle]="{ 'min-width': '10rem' }"
            [globalFilterFields]="['firstName','lastName'] " >

				<ng-template pTemplate="caption">
					<div class="flex justify-content-between flex-column sm:flex-row ">
                        <div>
                            <button pButton label="รีเซ็ต" class="p-button-outlined mb-2"
                         icon="pi pi-filter-slash" (click)="clear(agendaSerch)"></button>
                        </div>

                        <div>
                            <span class="p-input-icon-left" style="width: 350px">
                                <i class="pi pi-search"></i>
                                <input pInputText type="text" #filter (input)="onGlobalFilter(agendaSerch, $event)" placeholder="ค้นหาด้วย ชื่อ-นามสกุล" class="w-full"/>
                            </span>
                        </div>
					</div>
				</ng-template>
                <!-- OutSite Table -->
				<ng-template pTemplate="header">
                    <tr>
                      <th style="width: 3rem"></th>
                      <th style="min-width: 32rem">
                          <div class="flex justify-content-center align-items-center">
                              รายชื่อผู้ใช้งาน
                          </div>
                      </th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-agenda let-expanded="expanded">
                    <tr>
                        <td>
                          <p-button type="button" pRipple [pRowToggler]="agenda"
                          [text]="true" [rounded]="true" [plain]="true" [icon]="expanded  ? 'pi pi-chevron-down' : 'pi pi-chevron-right'" />
                        </td>
                        <td>{{ agenda?.firstName + ' ' + agenda?.lastName }}</td>
                    </tr>
                </ng-template>
                <!-- InSite Table -->
                    <ng-template pTemplate="rowexpansion" let-chapter>
                        <tr>
                            <td colspan="3">
                                <div class="p-3">
                                    <p-table [value]="chapter.contents" dataKey="GroupName">
                                        <ng-template pTemplate="header">
                                            <tr>
                                            <th style="min-width: 6rem">
                                                <div class="flex justify-content-center align-items-center">
                                                    หัวข้อ
                                                </div>
                                            </th>
                                            <th style="min-width: 8rem">
                                                <div class="flex justify-content-center align-items-center">
                                                    เนื้อหา
                                                </div>
                                            </th>
                                            <th style="min-width: 6rem">
                                                <div class="flex justify-content-center align-items-center">
                                                    Action
                                                </div>
                                            </th>
                                            </tr>
                                        </ng-template>
                                        <ng-template pTemplate="body" let-content>
                                            <tr>
                                            <td>
                                                <div class="flex justify-content-start align-items-center">
                                                {{ content.contentTitle }}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="flex justify-content-start align-items-center">
                                                <span [innerHTML]="truncateText(content.body, 30)"></span>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="flex justify-content-center align-items-center gap-2">
                                                    <button pButton pRipple label="แก้ไข" icon="pi pi-pencil" class="p-button-info p-button-sm" (click)="editContent(content)">
                                                    </button>

                                                    <button pButton pRipple label="ลบ" icon="pi pi-trash" class="p-button-danger p-button-sm" (click)="confirmDeleteContentViaToast($event, content.contentId)">
                                                    </button>
                                                    <p-confirmPopup key="confirmDeleteContentViaToast"></p-confirmPopup>
                                                </div>
                                            </td>
                                            </tr>
                                        </ng-template>

                                    </p-table>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
    		</p-table>

        </div>
    </div>
</div>
