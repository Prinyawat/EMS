<p-breadcrumb [model]="[
  {icon: 'pi pi-home', routerLink: '/home'},
  {label: 'Admin'},
  {label: 'จัดการ Course', routerLink: '/admin/admin-course/'},
  {label: course?.courseName, routerLink: '/admin/admin-course/' + course?.courseId, styleClass: 'custom-admin'},
  ]">
</p-breadcrumb>
<p-toast key="tst"></p-toast>

<div class="grid" *ngIf="isLessonView">
  <div class="col-12">
    <div class="navigation-container">
      <button pButton pRipple type="button" label="กลับไปหน้า จัดการ Course" icon="pi pi-arrow-left" iconPos="left" class="p-button-outlined p-button-primary" [routerLink]="['/admin/admin-course/']"></button>

      <p-toggleButton [(ngModel)]="isLessonView" onLabel="แบบทดสอบ" offLabel="บทเรียน"></p-toggleButton>
    </div>
  </div>

  <div class="col-12">
    <div class="card">
      <p-toolbar styleClass="mb-4">
        <h3>{{course?.courseName}}</h3>
        <ng-template pTemplate="right">
            <button pButton pRipple type="button" label="เพิ่มบทเรียน" pTooltip="เพิ่มบทเรียน" tooltipPosition="bottom" (click)="showDialog()" class="p-button-success"></button>

            <p-dialog [header]="editMode ? 'แก้ไขบทเรียน' : 'เพิ่มบทเรียน'" [(visible)]="display" [modal]="true" showEffect="fade" [style]="{width: '40vw'}" [breakpoints]="{'960px': '80vw'}" >
                <div class="col-12">
                    <div class="card">
                        <div class="p-fluid p-formgrid grid">

                            <div class="field col-12 ">
                                <label htmlFor="chapterTitle" class="text-xl">ชื่อบทเรียน</label>
                                <input pInputText id="chapterTitle" type="text" [(ngModel)]="chapterTitle"/>
                            </div>

                        </div>
                    </div>
                </div>
                <ng-template pTemplate="footer">
                    <button pButton [label]="editMode ? 'แก้ไข' : 'เพิ่ม'" [ngClass]="editMode ? 'p-button-info' : 'p-button-success'" (click)="editMode ? updateChapter() : saveChapter()"></button>
                    <button pButton (click)="display = false" label="ปิด" class="p-button-outlined"></button>
                </ng-template>
            </p-dialog>
        </ng-template>
      </p-toolbar>

      <p-table #chapterdata [value]="chapters" dataKey="chapterId" [tableStyle]="{ 'min-width': '60rem' }" [rows]="5" [loading]="loading" [rowHover]="true" styleClass="p-datatable-gridlines" [paginator]="true" [globalFilterFields]="['title']" responsiveLayout="scroll" [expandedRowKeys]="expandedRows" (onRowExpand)="onRowExpand($event)" (onRowCollapse)="onRowCollapse($event)">

        <ng-template pTemplate="caption">
          <div class="flex justify-content-between flex-column sm:flex-row">
              <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(chapterdata)"></button>
              <span class="p-input-icon-left mb-2">
                  <i class="pi pi-search"></i>
                  <input pInputText type="text" #filter (input)="onGlobalFilter(chapterdata, $event)" placeholder="ค้นหาบทเรียน" class="w-full"/>
              </span>
          </div>
      </ng-template>
        <ng-template pTemplate="header">
            <tr>
              <th style="width: 3rem"></th>
              <th style="min-width: 32rem">
                  <div class="flex justify-content-center align-items-center">
                      บทเรียน
                  </div>
              </th>
              <th style="min-width: 6rem" >
                  <div class="flex justify-content-center ">
                      Action
                  </div>
              </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-chapter let-expanded="expanded">
            <tr>
                <td>
                  <p-button type="button" pRipple [pRowToggler]="chapter" [text]="true" [rounded]="true" [plain]="true" [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'" />
                </td>
                <td><strong>{{ chapter.title }}</strong></td>
                <td>
                  <div class="flex justify-content-center align-items-center gap-2">

                    <button pButton pRipple label="เพิ่มหัวข้อ" icon="pi pi-plus" class="p-button-success p-button-sm"(click)="showDialogContent(chapter.chapterId)">
                    </button>

                      <button pButton pRipple label="แก้ไข" icon="pi pi-pencil" class="p-button-info p-button-sm" (click)="editChapter(chapter)">
                      </button>

                      <button pButton pRipple label="ลบ" icon="pi pi-trash" class="p-button-danger p-button-sm" (click)="confirmDeleteViaToast($event, chapter.chapterId)">
                      </button>
                      <p-confirmPopup key="confirmDeleteViaToast"></p-confirmPopup>

                  </div>
              </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
              <td colspan="3">ไม่พบข้อมูลบทเรียน.</td>
          </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
          <tr>
              <td colspan="3">โปรดรอสักครู่./td>
          </tr>
      </ng-template>

        <!-- Row Expansion สำหรับแสดงหัวข้อย่อย -->
        <ng-template pTemplate="rowexpansion" let-chapter>
            <tr>
                <td colspan="3">
                    <div class="p-3">
                        <p-table [value]="chapter.contents" dataKey="id">
                            <ng-template pTemplate="header">
                                <tr>
                                  <th style="min-width: 6rem">
                                    <div class="flex justify-content-center align-items-center">
                                        หัวข้อ
                                    </div>
                                  </th>
                                  <th style="min-width: 8rem">
                                    <div class="flex justify-content-center align-items-center">
                                        เนื้อหา
                                    </div>
                                  </th>
                                  <th style="min-width: 6rem">
                                    <div class="flex justify-content-center align-items-center">
                                        Action
                                    </div>
                                  </th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-content>
                                <tr>
                                  <td>
                                    <div class="flex justify-content-start align-items-center">
                                      {{ content.contentTitle }}
                                    </div>
                                  </td>
                                  <td>
                                    <div class="flex justify-content-start align-items-center">
                                      <span [innerHTML]="truncateText(content.body, 30)"></span>
                                    </div>
                                  </td>
                                  <td>
                                    <div class="flex justify-content-center align-items-center gap-2">
                                        <button pButton pRipple label="แก้ไข" icon="pi pi-pencil" class="p-button-info p-button-sm" (click)="editContent(content)">
                                        </button>

                                        <button pButton pRipple label="ลบ" icon="pi pi-trash" class="p-button-danger p-button-sm" (click)="confirmDeleteContentViaToast($event, content.contentId)">
                                        </button>
                                        <p-confirmPopup key="confirmDeleteContentViaToast"></p-confirmPopup>
                                    </div>
                                  </td>
                                </tr>
                            </ng-template>

                            <ng-template pTemplate="emptymessage">
                              <tr>
                                  <td colspan="8">ไม่พบข้อมูลหัวข้อ.</td>
                              </tr>
                          </ng-template>
                          <ng-template pTemplate="loadingbody">
                              <tr>
                                  <td colspan="8">โปรดรอสักครู่.</td>
                              </tr>
                          </ng-template>
                        </p-table>
                    </div>
                </td>
            </tr>
        </ng-template>
      </p-table>
      <p-dialog [header]="editMode ? 'แก้ไขหัวข้อ' : 'เพิ่มหัวข้อ'" [(visible)]="displayContent" [modal]="true" showEffect="fade" [style]="{width: '75vw'}" [breakpoints]="{'960px': '80vw'}" >

        <div class="col-12">
            <div class="card">
                <div class="p-fluid p-formgrid grid">

                    <div class="field col-12 md:col-6">
                        <label htmlFor="Title" class="text-xl">ชื่อหัวข้อ</label>
                        <input pInputText id="Title" type="text" [(ngModel)]="contentTitle"/>
                    </div>

                    <div class="field col-12">

                        <label htmlFor="body" class="text-xl">เนื้อหารายละเอียด</label>
                        <textarea id="body" rows="5" cols="30" placeholder="เพิ่มคำอธิบาย..." pInputTextarea [(ngModel)]="body" ></textarea>

                    </div>
                </div>
            </div>
        </div>

        <ng-template pTemplate="footer">
            <button pButton [label]="editMode ? 'แก้ไข' : 'เพิ่ม'" [ngClass]="editMode ? 'p-button-info' : 'p-button-success'" (click)="editMode ? updateContent() : saveContent()"></button>
            <button pButton (click)="displayContent = false" label="ปิด" class="p-button-outlined"></button>
        </ng-template>
    </p-dialog>
    </div>
  </div>
</div>
