<p-breadcrumb [model]="[
  {label: 'Home', routerLink: '/home'}, 
  {label: 'Course'}, 
  {label: course?.courseName, routerLink: '/course/course-open/' + course?.courseId}, 
  {label: chapters?.title}]">
</p-breadcrumb>

<h1>{{ chapters?.title }}</h1>

<p-table
  [value]="chapters?.contents"
  styleClass="p-datatable-gridlines custom-table"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="header">
    <tr>
      <th>หัวข้อที่</th>
      <th class="text-center">หัวข้อ</th>
      <th class="text-center">สถานะ</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-content let-i="rowIndex">
    <tr>
      <td>{{ i + 1 }}</td>
      <td>
        <a [routerLink]="[content.contentId]">
          {{ content.contentTitle }}
        </a>
      </td>
      <td class="text-center">
        <p-tag
          *ngIf="content.recordRead"
          icon="pi pi-check"
          severity="success"
          value="อ่านแล้ว"
        ></p-tag>
      </td>
    </tr>
  </ng-template>
</p-table>

<div class="navigation-container">
  <button  *ngIf="!isAllContentRead()" pButton pRipple type="button" label="กลับ" icon="pi pi-arrow-left" iconPos="left" class="p-button-outlined p-button-primary" [routerLink]="['/course/course-open', course?.courseId]"></button>
  <button pButton pRipple type="button" [label]="isAllContentRead() ? 'ไปหน้า Chapter' : 'ถัดไป'" icon="pi pi-arrow-right" iconPos="right" class="p-button-outlined p-button-primary" [routerLink]="getNextContentRouterLink()" [disabled]="!canNavigateNext()"></button>
</div>
