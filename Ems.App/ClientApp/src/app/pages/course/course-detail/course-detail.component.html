<p-breadcrumb [model]="[{label: 'Home', routerLink: '/home'}, {label: 'Course'}, {label: course?.title}]"></p-breadcrumb>
<h1>{{ course?.title }}</h1>
<h3>{{ course?.subtitle }}</h3>
<p>{{ course?.description }}</p>

<h2>Chapters</h2>
<p-table [value]="course?.chapters" styleClass="p-datatable-gridlines custom-table" responsiveLayout="scroll">
  <ng-template pTemplate="header">
    <tr>
      <th>ตอนที่</th>
      <th class="text-center">หัวข้อ</th>
      <th class="text-center">เอกสาร</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-chapter let-i="rowIndex">
    <tr>
      <td>{{ i + 1 }}</td>
      <td>{{ chapter.title }}</td>
      <td class="text-center">
        <button pButton pRipple type="button" label="อ่าน" class="p-button-text" [routerLink]="[chapter.id]"></button>
      </td>
    </tr>
  </ng-template>
</p-table>


<div class="navigation-container">
  <button pButton pRipple type="button" label="Next" icon="pi pi-arrow-right" iconPos="right" class="p-button-outlined p-button-primary" [routerLink]="[course.chapters[0].id]"></button>
</div>
