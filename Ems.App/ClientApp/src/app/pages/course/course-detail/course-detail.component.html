<p-breadcrumb [model]="[{label: 'Home', routerLink: '/home'}, {label: 'Course'}, {label: course?.courseName}]"></p-breadcrumb>

<h1 class="p-d-flex p-ai-center">
  {{ course?.courseName }}
  <ng-container *ngIf="course?.status === 'เสร็จสิ้น'; else quizButton">
    <span class="p-tag p-tag-success ml-3">สถานะ: เสร็จสิ้น</span>
  </ng-container>
  <ng-template #quizButton>
    <button
      pButton
      pRipple
      type="button"
      label="แบบทดสอบ"
      class="p-button-outlined"
      [routerLink]="['quiz']"
      [disabled]="course?.status === 'เสร็จสิ้น'"
    ></button>
  </ng-template>
</h1>
<h3>{{ course?.subtitle }}</h3>
<p [innerHTML]="course?.description"></p>

<h2>Chapters</h2>
<p-table
  [value]="course?.chapters"
  styleClass="p-datatable-gridlines custom-table"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="header">
    <tr>
      <th>ตอนที่</th>
      <th class="text-center">หัวข้อ</th>
      <th class="text-center">สถานะ</th>
      <th class="text-center">เอกสาร</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-chapters let-i="rowIndex">
    <tr>
      <td>{{ i + 1 }}</td>
      <td>{{ chapters.title }}</td>
      <td class="text-center">
        <p-tag
          *ngIf="isChapterCompleted(chapters)"
          icon="pi pi-check"
          severity="success"
          value="อ่านครบแล้ว"
        ></p-tag>
      </td>
      <td class="text-center">
        <button
          pButton
          pRipple
          type="button"
          label="อ่าน"
          class="p-button-text"
          [routerLink]="[chapters?.chapterId]"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<div  class="navigation-container">
  <button *ngIf="!isAllChaptersCompleted()" pButton pRipple type="button" label="ถัดไป" icon="pi pi-arrow-right" iconPos="right" class="p-button-outlined p-button-primary" [routerLink]="getNextChapterRouterLink()" ></button>
</div>
