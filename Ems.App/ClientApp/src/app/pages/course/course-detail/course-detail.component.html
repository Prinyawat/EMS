<p-breadcrumb
  [model]="[{label: 'Home', routerLink: '/home'}, {label: 'หลักสูตร'}, {label: course?.courseName}]"></p-breadcrumb>
<br>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <h1 class="p-d-flex flex align-items-center ">
        {{ course?.courseName }}
        <ng-container *ngIf="course?.statusName === 'เสร็จสิ้น' || course?.statusName === 'ไม่ผ่าน'">
          <span class="p-tag ml-2"
            [ngClass]="{'p-tag-success': course?.statusName === 'เสร็จสิ้น', 'p-tag-danger': course?.statusName === 'ไม่ผ่าน'}">สถานะ:
            {{ course?.statusName }}</span>
        </ng-container>
        <ng-container *ngIf="isAllChaptersCompleted() && course?.statusName !== 'ไม่ผ่าน' && course?.statusName !== 'เสร็จสิ้น'">
          <button pButton pRipple type="button" label="แบบทดสอบหลังเรียน" class="p-button-outlined ml-4"
            [routerLink]="['quiz']"></button>
        </ng-container>
      </h1>
      <h3>{{ course?.subtitle }}</h3>
      <p [innerHTML]="course?.description"></p>

      <h2>บทเรียน</h2>
      <p-table [value]="course?.chapters" styleClass="p-datatable-gridlines custom-table" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th class="text-center" style="width: 80px;">บทที่</th>
            <th class="text-center" style="min-width: 12rem">บทเรียน</th>
            <th class="text-center" style="min-width: 4rem">เอกสาร</th>
            <th class="text-center" style="min-width: 4rem">สถานะ</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-chapters let-i="rowIndex">
          <tr>
            <td class="text-center" style="width: 80px;">{{ i + 1 }}</td>
            <td style="min-width: 12rem">{{ chapters.title }}</td>
            <td class="text-center" style="min-width: 4rem">
              <button pButton pRipple type="button" label="อ่าน" class="p-button-text"
                [routerLink]="[chapters?.chapterId]"></button>
            </td>
            <td class="text-center" style="min-width: 4rem">
              <p-tag *ngIf="isChapterCompleted(chapters)" icon="pi pi-check" severity="success"
                value="อ่านครบแล้ว"></p-tag>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <div class="navigation-container">
        <button *ngIf="!isAllChaptersCompleted()" pButton pRipple type="button" label="ถัดไป" icon="pi pi-arrow-right"
          iconPos="right" class="p-button-outlined p-button-primary" [routerLink]="getNextChapterRouterLink()"></button>
      </div>
    </div>
  </div>
</div>
