<p-toast key="DeleteSucess"></p-toast>
<div class="grid p-fluid" >

    <div class="col-12 ">
        <div class="card card-w-title">
            <p-breadcrumb [model]="breadcrumbItems" [home]="{icon: 'pi pi-home'}"></p-breadcrumb>
        </div>
    </div>

    <div class="col-12 md:col-12">
        <div class="card col-12">
            <p-toolbar styleClass="mb-4">

                <h5>ประวัติบันทึกเวลาเข้างาน</h5>
                <ng-template pTemplate="right">
                    <button pButton pRipple label="ส่งออก Excel" icon="pi pi-print" class="p-button-help" (click)="exportExcel()" pTooltip="XLS" tooltipPosition="bottom"></button>
                </ng-template>

            </p-toolbar>

			<p-table #agendaSerch [value]="filteredAgendas" [loading]="loading" [(selection)]="selectedAgendas" selectionMode="checkbox" [rows]="10" [rowHover]="true" styleClass="p-datatable-gridlines" [paginator]="true" responsiveLayout="scroll"
            [globalFilterFields]="['firstName','lastName','checkingDate','checkingStatus'] " [sortOrder]="-1" sortField="checkingDate">
				<ng-template pTemplate="caption">

					<div class="flex justify-content-between flex-column sm:flex-row ">
                        <div>
                            <span class="p-input-icon-left" style="width: 350px">
                                <i class="pi pi-search"></i>
                                <input pInputText type="text" #filter (input)="onGlobalFilter(agendaSerch, $event)" placeholder="ค้นหาด้วย ชื่อ-นามสกุล, วัน, การปฏิบัติงาน" class="w-full"/>
                            </span>
                        </div>
                        <p-dropdown [ngModel]="selectedStatus" [options]="updateDropdownOptions" (onChange)="filterDropDown($event.value)" placeholder="เลือกทั้งหมด" >
                            <ng-template let-option pTemplate="item">
                                <span [style.background-color]="getStatusColor(option.label)" [style.color]="'white'"
                                [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                            </ng-template>
                        </p-dropdown>

					</div>

				</ng-template>
				<ng-template pTemplate="header">
					<tr>
                        <th style="min-width: 4rem">
                            <div class="flex justify-content-center">
                                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                            </div>
                        </th>
						<th style="min-width: 8rem">
							<div class="flex justify-content-center align-items-center">
								ชื่อ - นามสกุล
							</div>
						</th>
                        <th style="min-width: 10rem" >
							<div class="flex justify-content-center align-items-center">
								วัน/เดือน/ปี
							</div>
						</th>
						<th style="min-width: 8rem">
							<div class="flex justify-content-center ">
								เวลาเข้า
							</div>
						</th>
                        <th style="min-width: 8rem">
							<div class="flex justify-content-center ">
								เวลาออก
							</div>
						</th>
						<th style="min-width: 8rem">
							<div class="flex justify-content-center align-items-center">
								การปฏิบัติงาน
							</div>
						</th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-agenda>
					<tr>
                        <td>
                            <div class="flex justify-content-center align-items-center">
                                <p-tableCheckbox [value]="agenda"></p-tableCheckbox>
                            </div>
                        </td>
						<td>
                            <div class="flex text-left">
                                {{agenda?.firstName + ' ' + agenda?.lastName}}
                            </div>
						</td>
						<td>
                            <div class="flex justify-content-center align-items-center">
                            <span>
                                {{ agenda?.checkingDate ? (agenda.checkingDate | date: 'dd/MM/yyyy') : '-' }}
                              </span>
                            </div>
						</td>
						<td>
                            <div class="flex justify-content-center align-items-center">
							    <span>{{agenda?.checkIn}}</span>
                            </div>
						</td>
						<td>
                            <div class="flex justify-content-center align-items-center">
							    {{agenda?.checkOut}}
                            </div>
						</td>
						<td>
                            <div class="flex justify-content-center align-items-center">
							    <span [class]="'customer-badge status-' + agenda?.checkingStatus"
                                [style.background-color]="getStatusColor(agenda?.checkingStatus)"
                                [style.color]="'white'">{{agenda?.checkingStatus}}</span>
                            </div>
						</td>
					</tr>
				</ng-template>
    		</p-table>

        </div>
    </div>
</div>
