<div class="grid p-fluid" >

    <div class="col-12 ">
        <div class="card card-w-title">
            <p-breadcrumb [model]="breadcrumbItems" [home]="{icon: 'pi pi-home'}"></p-breadcrumb>
        </div>
    </div>

    <div class="col-12 md:col-12">
        <div class="card col-12">
            <p-toolbar styleClass="mb-4">

                <h5>User Agenda</h5>
                <ng-template pTemplate="right">
                    <button pButton pRipple label="Export" icon="pi pi-print" class="p-button-help" (click)="exportExcel()" pTooltip="XLS" tooltipPosition="bottom"></button>

                </ng-template>

            </p-toolbar>

			<p-table #ca1 [value]="customeragenda" [rows]="5" [rowHover]="true" styleClass="p-datatable-gridlines" [paginator]="true" responsiveLayout="scroll"
            [globalFilterFields]="['country.name','name','days','status']">
				<ng-template pTemplate="caption">

					<div class="flex justify-content-between flex-column sm:flex-row ">
                        <div>
                            <button pButton label="Clear" class="p-button-outlined mb-2"
                         icon="pi pi-filter-slash" (click)="clear(ca1)"></button>
                        </div>
                        <div>
                            <span class="p-input-icon-left mb-2">
                                <i class="pi pi-search"></i>
                                <input pInputText type="text" #filter (input)="onGlobalFilter(ca1, $event)" placeholder="Search Keyword" class="w-full"/>
                            </span>
                        </div>

					</div>

				</ng-template>
				<ng-template pTemplate="header">
					<tr>
						<th style="min-width: 12rem" pSortableColumn="name">
							<div class="flex justify-content-center ">
								Name
                                <p-sortIcon field="name"></p-sortIcon>
							</div>
						</th>
						<th style="min-width: 12rem" pSortableColumn="days">
							<div class="flex justify-content-center ">
								Days
                                <p-sortIcon field="days"></p-sortIcon>
							</div>
						</th>
						<th style="min-width: 10rem" pSortableColumn="checkin">
							<div class="flex justify-content-center ">
								Check In
                                <p-sortIcon field="checkin"></p-sortIcon>
							</div>
						</th>
                        <th style="min-width: 10rem" pSortableColumn="checkout">
							<div class="flex justify-content-center ">
								Check Out
                                <p-sortIcon field="checkout"></p-sortIcon>
							</div>
						</th>
						<th style="min-width: 10rem" pSortableColumn="date">
							<div class="flex justify-content-center ">
								Date
                                <p-sortIcon field="date"></p-sortIcon>
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-center align-items-center">
								Status
                                <p-columnFilter field="status" display="menu">
                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                        <p-dropdown [ngModel]="value" [options]="statuses" (onChange)="filter($event.value)" placeholder="Any">
                                            <ng-template let-option pTemplate="item">
                                                <span [style.background-color]="getStatusColor(option.value)" [style.color]="'white'"
                                                [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                                            </ng-template>
                                        </p-dropdown>
                                    </ng-template>
                                </p-columnFilter>
							</div>
						</th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-agenda>
					<tr>
						<td>
							{{agenda.name}}
						</td>
						<td>
							<span>{{agenda.days}}</span>
						</td>
						<td>
							<span>{{agenda.checkin}}</span>
						</td>
						<td>
							<span>{{agenda.checkout}}</span>
						</td>
						<td>
							{{agenda.date | date: 'dd/MM/yyyy'}}
						</td>
						<td>
                            <div class="flex justify-content-center align-items-center">
							    <span [class]="'customer-badge status-' + agenda.status" [style.background-color]="getStatusColor(agenda.status)"
                                [style.color]="'white'">{{agenda.status}}</span>
                            </div>
						</td>
					</tr>
				</ng-template>
    		</p-table>

        </div>
    </div>
</div>
