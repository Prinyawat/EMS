<div class="grid p-fluid">

    <div class="col-12">
        <div class="card card-w-title">
            <p-breadcrumb [model]="breadcrumbItems" [home]="{icon: 'pi pi-home'}"></p-breadcrumb>
        </div>
    </div>

    <div class="col-12 lg:col-12 xl:col-12">
        <div class="card">
            <h5>Leave Request</h5>
            <!-- <div class="flex col-12 md:col-12"> -->
                <div class="col-12 md:col-12 ">
                    <div class="flex flex-wrap gap-3 mt-5 justify-content-center align-">

                        <p-calendar #calendar [ngStyle]="{'width': '200px'}" [(ngModel)]="Dates" selectionMode="multiple" [readonlyInput]="true" placeholder="ปฎิทินลา" size="small" [showIcon]="true"
                        (onSelect)="onCalendarSelect($event)" (onClear)="onClearCalendarDate()"
                        (ngModelChange)="onModelChange($event)" [disabled]="HalfStatusOn"
                        (onBlur)="onCalendarBlur()" [showButtonBar]="true" [ngClass]="{'ng-invalid ng-dirty': InvselectedDates}" (ngModelChange)="onValueChange('Dates')" (onMouseEnter)="op.show($event, calendar)"
                        (onMouseLeave)="op.hide()"/>

                        <p-overlayPanel #op>
                            <p *ngIf="Dates.length > 0">📅 <strong>วันที่ที่เลือก:</strong></p>
                            <ul *ngIf="Dates.length > 0">
                                <li *ngFor="let date of Dates">{{ date | date: 'dd/MM/yyyy' }}</li>
                            </ul>
                            <p *ngIf="Dates.length === 0" class="text-muted">ยังไม่มีการเลือกวัน</p>
                        </p-overlayPanel>

                        <p-dropdown [options]="leaveRequestStatus" [(ngModel)]="selectedLeaveStatus"
                            placeholder="เลือกประเภทการลา" [ngStyle]="{'width': '180px'}" optionLabel="leaveStatusData" [ngClass]="{'ng-invalid ng-dirty': InvselectedLeaveStatus}" (ngModelChange)="onValueChange('selectedLeaveStatus')">
                            <ng-template let-option pTemplate="item" >
                                    <span [ngStyle]="{'background-color': getStatusColor(option.leaveStatusData)}"
                                    [class]="'customer-badge status-' + option.leaveStatusData" [style.color]="'white'">
                                    {{ option.leaveStatusData }}</span>
                            </ng-template>
                        </p-dropdown>

                        <div class="flex flex-wrap mt-3 gap-3">

                            <p-dropdown [options]="leaveRequestHalfStatus" [(ngModel)]="selectedLeaveHalfStatus"
                            placeholder="กรณีการลา" [ngStyle]="{'width': '200px'}" optionLabel="halfStatus" (onChange)="onLeaveStatusChange()" [ngClass]="{'ng-invalid ng-dirty': InvselectedLeaveHalfStatus}" (ngModelChange)="onValueChange('selectedLeaveHalfStatus')">
                                <ng-template let-option pTemplate="item">
                                        <span [ngStyle]="{'background-color': getStatusColor(option.halfStatus)}"
                                        [class]="'customer-badge status-' + option.halfStatus" [style.color]="'white'">
                                        {{ option.halfStatus }}</span>
                                </ng-template>
                            </p-dropdown>
                            <span class="p-float-label" [ngStyle]="{'width': '180px'}">
                                <p-calendar *ngIf="isCustomLeave || true" [(ngModel)]="startTime" [timeOnly]="true" [ngClass]="{'ng-invalid ng-dirty': InvstartTime}" [hourFormat]="12" (ngModelChange)="onValueChange('startTime');"></p-calendar>
                                <label for="float-input">เวลาเริ่มของวัน</label>
                            </span>
                            <span class="p-float-label" [ngStyle]="{'width': '180px'}">
                                <p-calendar *ngIf="isCustomLeave || true" [(ngModel)]="endTime" [timeOnly]="true" [ngClass]="{'ng-invalid ng-dirty': InvendTime}"  [hourFormat]="12" (ngModelChange)="onValueChange('endTime');"></p-calendar>
                                <label for="float-input">เวลาสิ้นสุดของวัน</label>
                            </span>

                        </div>

                    </div>
                    <div class="flex flex-wrap mt-3 md:col-12 justify-content-center">

                        <textarea rows="5" cols="30" placeholder="คำอธิบายเพิ่มเติม...." pInputTextarea [ngStyle]="{'width': '710px'}" [(ngModel)]="additionalDescription"></textarea>

                    </div>
                    <div class="flex flex-wrap mt-3 md:col-12 justify-content-center">

                        <button  pButton icon="pi pi-check" label="ส่งคำขออนุญาติ"
                        (click)="confirm2($event)" [ngStyle]="{'width': '250px'}" ></button>
                        <p-confirmPopup key="confirm2"></p-confirmPopup>
                        <p-toast></p-toast>

                    </div>

                </div>
            <!-- </div> -->
        </div>
    </div>

</div>
