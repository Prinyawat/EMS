<div class="grid p-fluid">

    <div class="col-12">
        <div class="card card-w-title">
            <p-breadcrumb [model]="breadcrumbItems" [home]="{icon: 'pi pi-home'}"></p-breadcrumb>
        </div>
    </div>

    <div class="col-12 md:col-12">
        <div class="card">

            <h5>Check Information</h5>
            <div class="grid formgrid justify-content-center">
                <div class="formgroup-inline ">
                    <div class="field col-12 md:col">
                        <p-inputGroup>
                            <p-inputGroupAddon>
                                <i class="pi pi-stopwatch"></i>
                            </p-inputGroupAddon>
                            <input pInputText type="text" placeholder="Time In" [disabled]="true"/>
                        </p-inputGroup>
                    </div>
                    <div class="field col-12 md:col mr-auto">
                        <p-inputGroup>
                            <p-inputGroupAddon>
                                <i class="pi pi-stopwatch"></i>
                            </p-inputGroupAddon>
                            <input pInputText type="text" placeholder="Time Out" [disabled]="true" />
                        </p-inputGroup>
                    </div>

                </div>
            </div>

            <div class="grid formgrid col-12 justify-content-center ml-2 md-2">
                <div class="formgroup-inline justify-content-center">
                    <button pButton pRipple type="button" icon="pi pi-calendar" class="p-button-rounded p-button-warning p-button-outlined justify-content-center gap-2"> {{currentDateTime}} </button>
                </div>
            </div>

            <div class="grid formgrid justify-content-center">
                <div class="formgroup-inline justify-content-center">

                    <div class="field col-12 md:col-3 ml-auto">
                        <button pButton pRipple type="button" class="p-button-rounded p-button-text justify-content-center ">{{ hours }} Hours</button>
                    </div>
                    <div class="field col-12 md:col-3 ml-auto">
                        <button pButton pRipple type="button" class="p-button-rounded p-button-success p-button-text justify-content-center ">{{ minutes }} Minutes</button>
                    </div>
                    <div class="field col-12 md:col-3 ml-auto">
                        <button pButton pRipple type="button" class="p-button-rounded p-button-info p-button-text justify-content-center align-item-center ">{{ seconds }} Seconds</button>
                    </div>

                </div>
            </div>

            <div class="grid formgrid mt-3 justify-content-center">
                <div class="col-12 md:col-3 ">
                    <div class="field-radiobutton justify-content-center">
                        <p-radioButton name="city" value="CheckIn" [(ngModel)]="valRadio" id="city1">
                        </p-radioButton>
                        <label for="city1">Check In</label>
                    </div>
                </div>
                <div class="col-12 md:col-3 ">
                    <div class="field-radiobutton justify-content-center">
                        <p-radioButton name="city" value="CheckOut" [(ngModel)]="valRadio" id="city2">
                        </p-radioButton>
                        <label for="city2">Check Out</label>
                    </div>
                </div>
            </div>

            <div class="grid formgrid mt-3 justify-content-center">
                <div class="col-12 md:col-3">
                    <p-toast></p-toast>
                    <button (click)="confirm2($event)" pButton icon="pi pi-check" label="Confirm"></button>
                    <p-confirmPopup key="confirm2"></p-confirmPopup>
                </div>
            </div>

            <div class="col-12">
                <div class="card">
                    <h5>Mapping</h5>
                    <div id="map" style="height: 500px;"></div>
                </div>
            </div>

        </div>
    </div>
</div>
